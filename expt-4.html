<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h2 align="center">Hotel Room Booking Form</h2>
        Full Name:<input type="text"  required placeholder="Enter Your Full Name"><br>
        Email: <input type="email" placeholder="Enter YOUR Email" required><br>
        Phone:<input type="tel" placeholder="enter your mobile no." required><br>
        Check-in-Date:<input type="date" ><br>
        Check-out-Date:<input type="date"><br>
        Room Type:<select>
            <option>single bed room</option>
            <option>double bed room</option>
            <option>deluxe room</option>
        </select><br>
        No.of Guests:<input type="number" min="1" max="6"><br>
        Special Request:<textarea></textarea><br>
        <input type="button" value="Book Now">
        <input type="button" value="Reset Form">


    </form>
</body>
</html>
