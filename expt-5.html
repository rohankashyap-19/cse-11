<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h2 align="center">Student Registration Form</h2>
        <hr>
        Full name:<input type="text" placeholder="Enter Your Full Name" required><br>
        Email: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input type="email" placeholder="Enter Your Email" required><br>
        Password:<input type="password" placeholder="Enter Your Password" required minlength="8" maxlength="16"><br>
        Gender:<input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <input type="radio" name="gender">Others<br>
        Course:<select>
            <option>Select Course</option>
            <option>MCA</option>
            <option>BCA</option>
            <option>B.Tech</option>
        </select><br>
       Contact no. : <input type="tel" placeholder="mobile no." required><br>
       Address:<textarea rows="10"></textarea><br>
       <button>Register</button>
       <button>Clear</button>
    </form>
</body>
</html>
