<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        body {
            font-family: Georgia, serif;
            margin: 0;
            padding: 0;
        }
        header, footer {
            background-color: #1a237e;
            color: white;
            text-align: center;
            padding: 20px;
        }
        footer {
            padding: 12px;
            margin-top: 20px;
        }
        main {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #888;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #e8eaf6;
            text-align: center;
        }
        fieldset {
            padding: 15px;
        }
        input[type="text"], input[type="email"], textarea {
            width: 60%;
            padding: 5px;
            margin-top: 4px;
        }
        textarea {
            width: 85%;
        }
    </style>
</head>
<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <section>
            <h2>Courses and Fees</h2>
            <table>
                <caption>Available Courses</caption>
                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Seats</th>
                        <th>Fees</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>&#8377;90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>&#8377;45,000</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <form action="#" method="post">
                <fieldset>
                    <legend>Application Form</legend>

                    <label for="app-name">Name:</label><br>
                    <input type="text" id="app-name" name="name" required><br><br>

                    <label for="app-email">Email:</label><br>
                    <input type="email" id="app-email" name="email" required><br><br>

                    <label for="app-course">Course:</label><br>
                    <select id="app-course" name="course">
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="BCA">BCA</option>
                    </select><br><br>

                    <label for="app-statement">Statement:</label><br>
                    <textarea id="app-statement" name="statement" rows="4" required></textarea><br><br>

                    <button type="submit">Apply</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        &copy; 2026 ABC College
    </footer>
</body>
</html>
